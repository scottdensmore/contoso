services:
  web:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/contoso-db
      # Defaulted so the stack authenticates out of the box. Without it CI and
      # a bare `docker compose up` have no secret, and every sign-in fails at
      # /api/auth/error rather than rejecting a credential.
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-local-development-only-not-a-real-secret}
      - NEXTAUTH_URL=http://localhost:3000
      - CHAT_ENDPOINT=http://chat:8000/api/create_response
      - CHAT_API_KEY=${CHAT_API_KEY:-dummy}
  db:
    image: postgres:15
    restart: always
    # Postgres reports "started" well before it accepts connections. Without
    # this, dependents race the socket and fail with P1001.
    #
    # -h forces the probe onto TCP. Without it pg_isready checks the Unix
    # socket, and the entrypoint runs a temporary socket-only server during
    # first-boot initialisation to create the database. A probe landing in that
    # window reports healthy while port 5432 is still closed, which leaves the
    # exact race this healthcheck exists to close.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d contoso-db"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contoso-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
      args:
        INSTALL_LOCAL_STACK: ${CHAT_INSTALL_LOCAL_STACK:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/contoso-db
      - PROJECT_ID=${PROJECT_ID}
      - REGION=${REGION:-us-central1}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-2.5-flash}
      - FIRESTORE_DATABASE=${FIRESTORE_DATABASE:-contoso-db}
      - DISCOVERY_ENGINE_APP_ID=${DISCOVERY_ENGINE_APP_ID}
      - DISCOVERY_ENGINE_DATASTORE_ID=${DISCOVERY_ENGINE_DATASTORE_ID}
      - ENVIRONMENT=development
      - LLM_PROVIDER=${LLM_PROVIDER:-gcp}
      - LOCAL_MODEL_NAME=${LOCAL_MODEL_NAME:-gemma3:12b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - CHROMA_DB_PATH=/app/data/chroma_db
    volumes:
      - chat_data:/app/data

volumes:
  postgres_data:
  chat_data:
