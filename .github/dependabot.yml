# Grouping notes:
#
# Package families must version in lockstep. Ungrouped, Dependabot bumps one
# member at a time and the install fails -- e.g. opentelemetry-sdk moving
# without opentelemetry-api leaves `pip install -c constraints.txt` unsolvable.
#
# Minor and patch updates are grouped per ecosystem so routine upgrades arrive
# as one reviewable PR. Major updates stay ungrouped: they need reading
# individually, and burying one in a group of twelve is how it gets rubber
# stamped.
#
# Groups are repeated per pip directory rather than shared via a YAML anchor,
# because Dependabot's config parser does not reliably support aliases.
#
# An `ignore` here is for an upgrade a resolver cannot install, not one nobody
# has read yet. Without it Dependabot reopens the same unmergeable pull request
# every Monday, and a permanently red check stops being read as a signal.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "web"
    ignore:
      # ESLint 10 cannot be installed here. Three packages peer on `eslint` with
      # a range that stops at 9, so npm fails with ERESOLVE before any lint rule
      # runs -- Dependabot proposed the major as #223 and Web App CI failed on
      # exactly that:
      #
      #   eslint-plugin-jsx-a11y@6.10.2                  ^3 || ... || ^9
      #   eslint-config-next > eslint-plugin-import       ^2 || ... || ^9
      #   eslint-config-next > eslint-plugin-react        ^3 || ... || ^9.7
      #
      # #69 tracks only the first. The other two are pinned inside
      # eslint-config-next, so bumping ESLint alone does not move them and
      # jsx-a11y shipping support is not on its own enough to lift this.
      # `tests/scripts/test_dependabot_holds.py` measures all three and fails
      # once none of them caps below 10; drop this entry when it does, and let
      # the eslint group carry the major as one lockstep pull request.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    groups:
      # `eslint-config-next` matches `eslint-*` but is published from the
      # Next.js repository and carries Next's version numbers, so it moves with
      # `next` rather than with ESLint. Grouped by the pattern alone it was held
      # hostage by an unrelated blocker: while the ESLint 10 major above was
      # unmergeable, #223 bundled the two together and neither could land, and
      # `main` sat with `next` at 16.3.0 against `eslint-config-next` 16.2.12.
      #
      # Excluded here rather than reordered, because a dependency joins the
      # first group whose patterns match it and `eslint` is declared first.
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
        exclude-patterns:
          - "eslint-config-next"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/services/chat"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "chat"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      google-cloud:
        patterns:
          - "google-cloud-*"
          - "google-auth*"
          - "vertexai"
      pytest:
        patterns:
          - "pytest"
          - "pytest-*"
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/services/chat/src/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "chat"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      google-cloud:
        patterns:
          - "google-cloud-*"
          - "google-auth*"
          - "vertexai"
      pytest:
        patterns:
          - "pytest"
          - "pytest-*"
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/services/chat/tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "chat"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      google-cloud:
        patterns:
          - "google-cloud-*"
          - "google-auth*"
          - "vertexai"
      pytest:
        patterns:
          - "pytest"
          - "pytest-*"
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
