# Grouping notes:
#
# Package families must version in lockstep. Ungrouped, Dependabot bumps one
# member at a time and the install fails -- e.g. opentelemetry-sdk moving
# without opentelemetry-api leaves `pip install -c constraints.txt` unsolvable.
#
# Minor and patch updates are grouped per ecosystem so routine upgrades arrive
# as one reviewable PR. Major updates stay ungrouped: they need reading
# individually, and burying one in a group of twelve is how it gets rubber
# stamped.
#
# Groups are repeated per pip directory rather than shared via a YAML anchor,
# because Dependabot's config parser does not reliably support aliases.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "web"
    groups:
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
      next:
        patterns:
          - "next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/services/chat"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "chat"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      google-cloud:
        patterns:
          - "google-cloud-*"
          - "google-auth*"
          - "vertexai"
      pytest:
        patterns:
          - "pytest"
          - "pytest-*"
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/services/chat/src/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "chat"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      google-cloud:
        patterns:
          - "google-cloud-*"
          - "google-auth*"
          - "vertexai"
      pytest:
        patterns:
          - "pytest"
          - "pytest-*"
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/services/chat/tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "chat"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      google-cloud:
        patterns:
          - "google-cloud-*"
          - "google-auth*"
          - "vertexai"
      pytest:
        patterns:
          - "pytest"
          - "pytest-*"
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
