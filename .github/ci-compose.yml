# CI-only bindings and credential isolation. No developer Compose changes.
# !override requires Docker Compose 2.24.4+ (available on ubuntu-latest).
services:
  web:
    ports: !override
      - '127.0.0.1:3100:3000'
  db:
    ports: !override
      - '127.0.0.1:55432:5432'
  chat:
    ports: !override
      - '127.0.0.1:8100:8000'
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/ci-no-cloud-credentials.json
